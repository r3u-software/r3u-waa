name: Deploy web dashboard to GitHub Pages

# WEB-DEPLOYMENT-ADDENDUM.md: HR/Admin's full dashboard + Platform Owner's
# 3 screens, exported as a static web build and hosted here. Worker/
# Supervisor stay on the Android .apk and are never part of this build.
#
# EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY are repo
# *variables*, not secrets -- the anon/publishable key is safe to ship
# client-side by design throughout this project (Row Level Security is the
# real authorization gate, not keeping this key hidden). Set via:
#   gh variable set EXPO_PUBLIC_SUPABASE_URL --body "..."
#   gh variable set EXPO_PUBLIC_SUPABASE_ANON_KEY --body "..."

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
